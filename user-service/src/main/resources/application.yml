server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5434/userdb
    username: taskflow
    password: taskflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566

  jackson:
    serialization:
      indent_output: true

logging:
  level:
    root: INFO
    com.taskflow: DEBUG
    software.amazon.awssdk: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
